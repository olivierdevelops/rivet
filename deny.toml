# cargo-deny policy (PLAN-2026-0001 TASK-049, T-27). ADR-0002: permissive licences only,
# ring-only TLS (no aws-lc-rs, no OpenSSL).

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
deny = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/olivierdevelops/capy"]
