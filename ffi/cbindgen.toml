# cbindgen configuration for librivet's C header (PROP-2026-0002 R13; PLAN-2026-0002 TASK-041).
# Regenerate:  cbindgen --config ffi/cbindgen.toml --crate rivet-ffi --output ffi/include/rivet.h
# CI regenerates it and fails when the checked-in header differs.
language = "C"
include_guard = "RIVET_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
sys_includes = ["stdint.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from ffi/src/lib.rs (rivet-ffi); do not edit by hand. */"
header = """/*
 * rivet.h — the C ABI of Rivet (librivet), ABI version 1.
 *
 * JSON in, JSON out, over NUL-terminated UTF-8 strings.
 *   - Every `char *` returned (except rivet_version()) is owned by the caller:
 *     free it with rivet_string_free().
 *   - Errors are ResponseEnvelope JSON with "status":"error" (never a crash):
 *     NULL / non-UTF-8 / freed arguments are validation.ffi_argument, panics
 *     are internal.panic.
 *   - RivetRuntime and RivetModule are thread-safe; a RivetCall belongs to one
 *     thread at a time. Handles are opaque; a freed handle is refused.
 *
 *   rivet_runtime_new(opts, &rt, &err) ─▶ rivet_request(rt, input) ─▶ envelope
 *   rivet_call_start(rt, input) ─▶ rivet_call_next(call, ms) … NULL ─▶ rivet_call_free
 *   rivet_load(rt, path, alias, &module, &err) ─▶ rivet_module_call(module, id, data)
 */"""

[parse]
parse_deps = false

[export]
include = ["RivetStatus", "RivetRuntime", "RivetCall", "RivetModule"]

[enum]
rename_variants = "None"

[fn]
args = "auto"
