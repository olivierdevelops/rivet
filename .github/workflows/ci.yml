# PLAN-2026-0001 TASK-051: T-27 (build/static), T-29 (samples) and T-31 (docs) on three OSes.
# PLAN-2026-0002 TASK-034: a Cargo workspace (rivet-runtime + ffi/); the `rivet` binary needs the
# `cli` feature, so the test job builds with --all-features; the `features` job is the T-10 matrix.
# PLAN-2026-0002 TASK-041/043: the release build includes librivet (rivet-ffi); conformance_ffi links
# the C examples shared and static and runs the Python ctypes examples (Unix); the header is verified.
# T-08's Linux sandbox gate needs a runner with kernel >= 6.12 (ADR-0003); until one is
# configured, sandboxed exec on Linux refuses with unsupported.sandbox_backend by design.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows was dropped from CI on 2026-09-29 (maintainer decision): Rivet 0.2.0 supports
        # macOS and Linux; the Windows failures are catalogued in INC-2026-0011 for a later port.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each step runs through scripts/ci_step.py, which re-emits failures as annotations
      # (readable without admin rights; job logs are not).
      - name: fmt
        run: python scripts/ci_step.py fmt -- cargo fmt --all --check
      - name: clippy
        if: always()
        run: python scripts/ci_step.py clippy -- cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: build (release)
        if: always()
        run: python scripts/ci_step.py build -- cargo build --release --workspace --all-features
      - name: tests (T-01…T-29 suites)
        if: always()
        run: python scripts/ci_step.py tests -- cargo test --workspace --all-targets --all-features --no-fail-fast
      # T-11: the checked-in C header must be exactly what cbindgen generates from ffi/src/lib.rs.
      - uses: taiki-e/install-action@v2
        if: always() && runner.os != 'Windows'
        with:
          tool: cbindgen
      - name: C header (T-11)
        if: always() && runner.os != 'Windows'
        run: python scripts/ci_step.py header -- cbindgen --config ffi/cbindgen.toml --crate rivet-ffi --verify --output ffi/include/rivet.h
      - name: docs (T-31)
        if: always()
        run: python scripts/ci_step.py docs -- python scripts/check_docs.py
      - name: version sync (T-33)
        if: always()
        run: python scripts/ci_step.py version -- python scripts/check_version.py --bin target/release/rivet${{ runner.os == 'Windows' && '.exe' || '' }}

  # T-10: the library builds with no default features and with each Cargo feature alone, and
  # conformance_features runs its cfg(not(feature = …)) cases against a real runtime.
  features:
    strategy:
      fail-fast: false
      matrix:
        features: ["none", "serve", "grpc", "quic", "oauth", "cli"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build (${{ matrix.features }})
        run: python scripts/ci_step.py build ${{ matrix.features }} -- cargo build -p rivet-runtime --no-default-features ${{ matrix.features != 'none' && format('--features {0}', matrix.features) || '' }}
      - name: conformance_features (${{ matrix.features }})
        if: always()
        run: python scripts/ci_step.py features ${{ matrix.features }} -- cargo test -p rivet-runtime --no-default-features ${{ matrix.features != 'none' && format('--features {0}', matrix.features) || '' }} --test conformance_features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
