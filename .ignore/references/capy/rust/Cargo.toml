[workspace]
members = ["cli", "devtools", "mcp", "playground", "wasm"]

# Shared metadata, inherited by every member via `foo.workspace = true`. Keeps
# the version numbers from drifting apart and gives each publishable crate the
# license/repository fields crates.io requires.
[workspace.package]
version = "0.22.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/olivierdevelops/capy"

[package]
name = "capy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Capy transpiler engine — a target-agnostic transpiler driven entirely by a .capy library"
readme = "README.md"
keywords = ["transpiler", "dsl", "codegen", "parser"]
categories = ["compilers", "parser-implementations"]
# Ship the library plus the self-contained integration tests, so `cargo publish`'s
# verify step exercises the public embedding API against the packaged crate — the
# one thing that would otherwise only ever be tested through a path dependency.
#
# tests/golden.rs is deliberately absent: it walks the repo's `samples/` corpus,
# which is far too large to publish, and it panics rather than skips when that
# directory is missing (on purpose — a silent skip would hide a CI regression).
# Cargo warns once about the ignored target; that warning is expected.
include = [
    "src/**/*.rs",
    "tests/embed.rs",
    "tests/define_extractor.rs",
    "tests/preprocessor.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
name = "capy_core"
path = "src/lib.rs"
# A plain rlib: no cdylib, no `extern "C"` surface. The wasm linear-memory ABI
# lives in the separate `capy-wasm-abi` crate so library consumers inherit
# nothing from it.
crate-type = ["rlib"]

[dependencies]
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
